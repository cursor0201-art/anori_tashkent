<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Solid Black Square Background -->
  <rect width="500" height="500" fill="#000000" />

  <!-- AN -->
  <text x="35" y="240" font-family="'Times New Roman', Georgia, serif" font-size="125" font-weight="bold" fill="#FFFFFF" letter-spacing="4">AN</text>

  <!-- Geometric Pomegranate Icon (O character) -->
  <g transform="translate(200, 115)">
    <!-- Main Pomegranate Base Hexagon/Octagon -->
    <polygon points="45,30 65,30 80,45 80,70 65,95 45,95 30,70 30,45" fill="#E60039" />
    
    <!-- 3D Diamond / Crystal Facets -->
    <polygon points="55,25 45,30 55,62.5" fill="#FF2E63" />
    <polygon points="55,25 65,30 55,62.5" fill="#D80032" />
    <polygon points="65,30 80,45 55,62.5" fill="#C70039" />
    <polygon points="80,45 80,70 55,62.5" fill="#900C3F" />
    <polygon points="80,70 65,95 55,62.5" fill="#750E21" />
    <polygon points="65,95 45,95 55,62.5" fill="#A00028" />
    <polygon points="45,95 30,70 55,62.5" fill="#D80032" />
    <polygon points="30,70 30,45 55,62.5" fill="#FF1E56" />
    <polygon points="30,45 45,30 55,62.5" fill="#FF4D79" />
    
    <!-- Crown at top -->
    <polygon points="48,26 40,10 55,18 70,10 62,26" fill="#E60039" />
    
    <!-- Scattered Seeds -->
    <polygon points="78,96 85,94 88,102 81,104" fill="#C70039" />
    <polygon points="88,90 94,92 92,97 86,96" fill="#E60039" />
  </g>

  <!-- RI -->
  <text x="325" y="240" font-family="'Times New Roman', Georgia, serif" font-size="125" font-weight="bold" fill="#FFFFFF" letter-spacing="4">RI</text>

  <!-- Subtitle Tagline -->
  <text x="45" y="320" font-family="'Montserrat', 'Helvetica Neue', sans-serif" font-size="21" font-weight="600" fill="#FFFFFF" letter-spacing="7.5">JEWELLERY AND ACCESSORIES STORE</text>
</svg>
