<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Black Background -->
  <rect width="100" height="100" rx="20" fill="#050505"/>

  <!-- Geometric Diamond Pomegranate Icon -->
  <g transform="translate(5, 5)">
    <!-- Outer shape -->
    <polygon points="45,28 65,28 80,43 80,68 65,93 45,93 30,68 30,43" fill="#E60039" />
    
    <!-- 3D Diamond Facets -->
    <polygon points="55,23 45,28 55,60.5" fill="#FF2E63" />
    <polygon points="55,23 65,28 55,60.5" fill="#D80032" />
    <polygon points="65,28 80,43 55,60.5" fill="#C70039" />
    <polygon points="80,43 80,68 55,60.5" fill="#900C3F" />
    <polygon points="80,68 65,93 55,60.5" fill="#750E21" />
    <polygon points="65,93 45,93 55,60.5" fill="#A00028" />
    <polygon points="45,93 30,68 55,60.5" fill="#D80032" />
    <polygon points="30,68 30,43 55,60.5" fill="#FF1E56" />
    <polygon points="30,43 45,28 55,60.5" fill="#FF4D79" />
    
    <!-- Pomegranate Crown -->
    <polygon points="48,24 40,8 55,16 70,8 62,24" fill="#E60039" />
    
    <!-- Scattered Crystal Seeds -->
    <polygon points="78,94 85,92 88,100 81,102" fill="#C70039" />
    <polygon points="88,88 94,90 92,95 86,94" fill="#E60039" />
  </g>
</svg>
